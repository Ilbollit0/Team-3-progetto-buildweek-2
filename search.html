<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Cerca</title>
  <!-- Gabriel: percorsi di CSS e JS aggiornati alla cartella assets/ -->
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-nav">
          <button class="nav-btn" aria-label="Indietro">‹</button>
          <button class="nav-btn" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill">Studente Epicode</div>
      </header>

      <section class="search">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input"
            placeholder="Cerca un brano, un album, un artista..." autocomplete="off" />
        </div>

        <!--
            COSTRUISCI IN search.js:
            - Debounce 400ms su "input" -> chiamata fetch a iTunes search
            - Tre sezioni: brani, album, artisti (Promise.all con entity differenti)
            - Salva ultima query in localStorage; al caricamento, riprendila
            - Click su brano -> Player; click su album/artist -> album.html/artist.html?id=...
          -->
        <div class="search-results">
          <section class="row" id="row-tracks" hidden>
            <h2>Brani</h2>
            <div class="grid" id="grid-tracks"></div>
          </section>
          <section class="row" id="row-albums" hidden>
            <h2>Album</h2>
            <div class="grid" id="grid-albums"></div>
          </section>
          <section class="row" id="row-artists" hidden>
            <h2>Artisti</h2>
            <div class="grid" id="grid-artists"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="player"></footer>
  </div>

  <audio id="audio-element"></audio>

  <script
  src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
  integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
  crossorigin="anonymous"
></script>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
  integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
  crossorigin="anonymous"
></script>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/search.js"></script>
</body>

</html>
