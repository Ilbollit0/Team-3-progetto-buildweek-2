<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Cerca</title>
  <!-- Gabriel: percorsi di CSS e JS aggiornati alla cartella assets/ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Francesca: link icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="app">
    <!--Francesca: sidebar fissa-->
    <aside class="sidebar">
      <div class="brand d-flex align-items-center gap-2">
        <div class="brand-mark d-grid rounded fw-bold">E</div>
        <span class="brand-text fw-bold">EpiTunes</span>
      </div>

      <!-- Gabriel: hamburger, su telefono e tablet; apre e chiude il menu con il collapse di Bootstrap -->
      <button type="button" class="menu-btn" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
        aria-controls="sidebar-menu" aria-expanded="false" aria-label="Apri il menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Gabriel: menu di telefono e tablet (Home, Cerca, preferiti); da lg è la sidebar sempre visibile -->
      <div class="sidebar-menu collapse" id="sidebar-menu">
        <nav class="sidebar-nav d-flex flex-column gap-1 mb-4">
          <a href="index.html" data-page="home" class="d-flex align-items-center gap-3 rounded text-decoration-none">
            <span class="ico"><i class="fa-solid fa-house"></i></span>
            <span>Home</span>
          </a>
          <a href="search.html" data-page="search" class="d-flex align-items-center gap-3 rounded text-decoration-none">
            <span class="ico"><i class="fa-sharp fa-solid fa-magnifying-glass text-white"></i></span>
            <span>Cerca</span>
          </a>
        </nav>

        <p class="sidebar-section-title text-uppercase m-0">
          I tuoi preferiti
        </p>
        <ul class="sidebar-list list-unstyled d-flex flex-column gap-1 m-0 p-0" id="sidebar-favs"></ul>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="user-pill ms-auto">Studente Epicode</div>
      </header>

      <section class="search">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input"
            placeholder="Cerca un brano, un album, un artista..." autocomplete="off" />
          <!--Francesca: pulsante X per cancellare il testo cercato-->
          <button type="button" id="search-clear" class="search-clear-btn" aria-label="Cancella ricerca" hidden>
            &times;
          </button>
        </div>

        <!--Francesca: sezione ricerche recenti visibile solo quando la barra è vuota-->
        <section id="recent-searches-section" class="mt-4" hidden>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h5 fw-bold text-white m-0">Ricerche recenti</h2>
            <button
              type="button"
              id="clear-recent-searches"
              class="btn btn-sm btn-link text-secondary text-decoration-none p-0"
            >
              Cancella cronologia
            </button>
          </div>
          <div id="recent-searches-list" class="d-flex flex-wrap gap-2 mb-4"></div>
        </section>

        <!--Francesca: brani dell'ultima ricerca con lo stesso layout delle card Brani-->
          <section class="row" id="recent-tracks-box" hidden>
            <h2>Brani cercati di recente</h2>
            <div class="grid" id="grid-recent-tracks"></div>
          </section>

        <div class="search-results">
          <section class="row" id="row-tracks" hidden>
            <h2>Brani</h2>
            <div class="grid" id="grid-tracks"></div>
          </section>
          <section class="row" id="row-albums" hidden>
            <h2>Album</h2>
            <div class="grid" id="grid-albums"></div>
          </section>
          <section class="row" id="row-artists" hidden>
            <h2>Artisti</h2>
            <div class="grid" id="grid-artists"></div>
          </section>
        </div>
      </section>
    </main>

    <!--Francesca: player fisso nel footer-->
    <footer class="player align-items-center px-3 py-2">
      <div class="player-track d-flex align-items-center gap-3">
        <div class="player-cover rounded overflow-hidden flex-shrink-0">
          <img id="player-cover-img" class="w-100 h-100 object-fit-cover" alt="" />
        </div>
        <div class="player-meta overflow-hidden">
          <p class="player-title fw-semibold text-truncate m-0" id="player-title">
            Seleziona un brano
          </p>
          <p class="player-artist text-truncate m-0" id="player-artist">—</p>
        </div>
      </div>

      <div class="player-center d-flex flex-column align-items-center gap-1">
        <div class="player-controls d-flex align-items-center gap-3">
          <button type="button" class="btn-ctrl border-0 bg-transparent" id="btn-shuffle" aria-label="Shuffle">
            ⇄
          </button>
          <button type="button" class="btn-ctrl border-0 bg-transparent" id="btn-prev" aria-label="Precedente">
            ⏮
          </button>
          <button type="button"
            class="btn-play rounded-circle border-0 d-flex align-items-center justify-content-center p-0"
            id="btn-toggle" aria-label="Play/Pausa">
            ▶
          </button>
          <button type="button" class="btn-ctrl border-0 bg-transparent" id="btn-next" aria-label="Successivo">
            ⏭
          </button>
          <button type="button" class="btn-ctrl border-0 bg-transparent" id="btn-repeat" aria-label="Ripeti">
            ↻
          </button>
        </div>
        <div class="player-progress d-flex align-items-center gap-2 w-100">
          <span id="time-current">0:00</span>
          <div class="progress-bar flex-grow-1 rounded-pill" id="progress-bar">
            <div class="progress-fill h-100 rounded-pill" id="progress-fill"></div>
          </div>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="player-right align-items-center justify-content-end gap-2">
        <span>🔊</span>
        <div class="volume-bar rounded-pill" id="volume-bar">
          <div class="volume-fill h-100 rounded-pill" id="volume-fill" style="width: 80%"></div>
        </div>
      </div>
    </footer>
  </div>

  <audio id="audio-element"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/search.js"></script>
</body>

</html>
