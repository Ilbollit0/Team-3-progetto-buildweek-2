<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Album</title>
    <!-- Francesca: link BOOTSTRAP/ -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <!-- Francesca: link icone -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Francesca: percorso CSS aggiornato alla cartella assets/ -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>

  <body>
    <div class="app">
      <!--Francesca: sidebar fissa-->
      <aside class="sidebar">
        <div class="brand d-flex align-items-center gap-2 pb-4">
          <div class="brand-mark d-grid rounded fw-bold">E</div>
          <span class="brand-text fw-bold">EpiTunes</span>
        </div>

        <nav class="sidebar-nav d-flex flex-column gap-1 mb-4">
          <a
            href="index.html"
            data-page="home"
            class="d-flex align-items-center gap-3 rounded text-decoration-none"
          >
            <span class="ico"><i class="fa-solid fa-house"></i></span>
            <span>Home</span>
          </a>
          <a
            href="search.html"
            data-page="search"
            class="d-flex align-items-center gap-3 rounded text-decoration-none"
          >
            <span class="ico"
              ><i class="fa-sharp fa-solid fa-magnifying-glass text-white"></i
            ></span>
            <span>Cerca</span>
          </a>
        </nav>

        <p class="sidebar-section-title text-uppercase m-0">I tuoi preferiti</p>
        <ul
          class="sidebar-list list-unstyled d-flex flex-column gap-1 m-0 p-0"
          id="sidebar-favs"
        ></ul>
      </aside>

      <main class="main">
        <header
          class="topbar d-flex align-items-center justify-content-between px-3 px-md-4 py-3"
        >
          <div class="topbar-nav d-flex align-items-center gap-2">
            <button type="button" class="nav-btn" aria-label="Indietro">
              ‹
            </button>
          </div>
          <div class="user-pill ms-auto w-auto px-3 rounded-pill text-nowrap">
            Studente Epicode
          </div>
        </header>

        <section class="album-page container-fluid px-3 px-md-4 pb-5">
          <div
            class="album-hero d-flex flex-column flex-md-row align-items-start align-items-md-end gap-3 gap-md-4 py-3 py-md-4"
            id="album-hero"
          ></div>
          <div
            class="hero-actions d-flex align-items-center gap-3 py-3"
            id="album-actions"
          ></div>
          <div class="tracklist mt-2" id="tracklist"></div>
        </section>
      </main>

      <!--Francesca: player fisso nel footer-->
      <footer class="player align-items-center px-3 py-2">
        <div class="player-track d-flex align-items-center gap-3">
          <div class="player-cover rounded overflow-hidden flex-shrink-0">
            <img
              id="player-cover-img"
              class="w-100 h-100 object-fit-cover"
              alt=""
            />
          </div>
          <div class="player-meta overflow-hidden">
            <p
              class="player-title fw-semibold text-truncate m-0"
              id="player-title"
            >
              Seleziona un brano
            </p>
            <p class="player-artist text-truncate m-0" id="player-artist">—</p>
          </div>
        </div>

        <div class="player-center d-flex flex-column align-items-center gap-1">
          <div class="player-controls d-flex align-items-center gap-3">
            <button
              type="button"
              class="btn-ctrl border-0 bg-transparent"
              id="btn-shuffle"
              aria-label="Shuffle"
            >
              ⇄
            </button>
            <button
              type="button"
              class="btn-ctrl border-0 bg-transparent"
              id="btn-prev"
              aria-label="Precedente"
            >
              ⏮
            </button>
            <button
              type="button"
              class="btn-play rounded-circle border-0 d-flex align-items-center justify-content-center p-0"
              id="btn-toggle"
              aria-label="Play/Pausa"
            >
              ▶
            </button>
            <button
              type="button"
              class="btn-ctrl border-0 bg-transparent"
              id="btn-next"
              aria-label="Successivo"
            >
              ⏭
            </button>
            <button
              type="button"
              class="btn-ctrl border-0 bg-transparent"
              id="btn-repeat"
              aria-label="Ripeti"
            >
              ↻
            </button>
          </div>
          <div class="player-progress d-flex align-items-center gap-2 w-100">
            <span id="time-current">0:00</span>
            <div
              class="progress-bar flex-grow-1 rounded-pill"
              id="progress-bar"
            >
              <div
                class="progress-fill h-100 rounded-pill"
                id="progress-fill"
              ></div>
            </div>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <div class="player-right align-items-center justify-content-end gap-2">
          <span>🔊</span>
          <div class="volume-bar rounded-pill" id="volume-bar">
            <div
              class="volume-fill h-100 rounded-pill"
              id="volume-fill"
              style="width: 80%"
            ></div>
          </div>
        </div>
      </footer>
    </div>

    <audio id="audio-element"></audio>

    <!-- Francesca: script BOOTSTRAP/ -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
      integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
      crossorigin="anonymous"
    ></script>
    <!-- Francesca: percorsi JS aggiornati alla cartella assets/ -->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/album.js"></script>
  </body>
</html>
