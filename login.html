<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Accedi o Registrati</title>
    <!--Francesca: link Bootstrap 5 CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <!--Francesca: link icone Font Awesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>
    <!--Francesca: CSS personalizzato-->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>

  <body class="bg-black text-white overflow-auto">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <div class="card bg-dark border-secondary-subtle rounded-4 shadow-lg p-4 p-md-5 w-100" style="max-width: 520px">
        <div class="card-body p-0">
          <!--Francesca: logo EpiTunes-->
          <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
            <span
              class="badge bg-warning text-dark fw-black fs-5 px-2 py-1 rounded-2">E</span>
            <span class="fs-4 fw-bold text-white">EpiTunes</span>
          </div>

          <!--Francesca: pulsanti Bootstrap per passare tra Accedi e Registrati-->
          <ul class="nav nav-pills nav-fill bg-black p-1 rounded-pill mb-5" id="auth-tabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active rounded-pill fw-semibold text-white" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#pane-login" type="button" role="tab" aria-controls="pane-login" aria-selected="true">
                Accedi
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link rounded-pill fw-semibold text-white" id="tab-register-btn" data-bs-toggle="pill" data-bs-target="#pane-register" type="button" role="tab" aria-controls="pane-register" aria-selected="false">
                Registrati
              </button>
            </li>
          </ul>

          <!--Francesca: riquadro messaggio di errore o conferma-->
          <div id="auth-alert" class="alert alert-danger py-2 px-3 small d-none" role="alert">
          </div>

          <div class="tab-content">
            <!--Francesca: SEZIONE ACCEDI-->
            <div
              class="tab-pane fade show active"
              id="pane-login"
              role="tabpanel"
              aria-labelledby="tab-login-btn">
              <form id="login-form" class="d-flex flex-column gap-4">
                <div>
                  <label
                    for="login-email"
                    class="form-label text-secondary small fw-semibold">
                    Email
                  </label>
                  <div class="input-group">
                    <span
                      class="input-group-text bg-black border-secondary text-secondary">
                      <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input
                      type="email"
                      id="login-email"
                      class="form-control bg-black text-white border-secondary py-2"
                      placeholder="nome@esempio.it"
                      required/>
                  </div>
                </div>

                <div>
                  <label
                    for="login-password"
                    class="form-label text-secondary small fw-semibold">
                    Password
                  </label>
                  <div class="input-group">
                    <span
                      class="input-group-text bg-black border-secondary text-secondary">
                      <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                      type="password"
                      id="login-password"
                      class="form-control bg-black text-white border-secondary py-2"
                      placeholder="Inserisci la tua password"
                      required/>
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-warning text-dark fw-bold rounded-pill py-2 mt-2 w-100">
                  Accedi
                </button>
              </form>
            </div>

            <!--Francesca: SEZIONE REGISTRATI-->
            <div
              class="tab-pane fade"
              id="pane-register"
              role="tabpanel"
              aria-labelledby="tab-register-btn">
              <form id="register-form" class="d-flex flex-column gap-4">
                <div class="row g-2">
                  <div class="col-6">
                    <label
                      for="reg-first-name"
                      class="form-label text-secondary small fw-semibold">
                      Nome
                    </label>
                    <input
                      type="text"
                      id="reg-first-name"
                      class="form-control bg-black text-white border-secondary py-2"
                      placeholder="es. Mario"
                      required/>
                  </div>
                  <div class="col-6">
                    <label
                      for="reg-last-name"
                      class="form-label text-secondary small fw-semibold">
                      Cognome
                    </label>
                    <input
                      type="text"
                      id="reg-last-name"
                      class="form-control bg-black text-white border-secondary py-2"
                      placeholder="es. Verdi"
                      required/>
                  </div>
                </div>

                <div>
                  <label
                    for="reg-email"
                    class="form-label text-secondary small fw-semibold">
                    Email
                  </label>
                  <div class="input-group">
                    <span
                      class="input-group-text bg-black border-secondary text-secondary">
                      <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input
                      type="email"
                      id="reg-email"
                      class="form-control bg-black text-white border-secondary py-2"
                      placeholder="nome@esempio.it"
                      required/>
                  </div>
                </div>

                <div>
                  <label
                    for="reg-password" class="form-label text-secondary small fw-semibold">
                    Password
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-black border-secondary text-secondary">
                      <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="reg-password" class="form-control bg-black text-white border-secondary py-2" placeholder="Crea una password (min. 6 caratteri)" minlength="6" required/>
                  </div>
                </div>

                <button type="submit" class="btn btn-warning text-dark fw-bold rounded-pill py-2 mt-2 w-100">
                  Crea account
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--Francesca: script Bootstrap 5 (serve per far funzionare le tab Accedi/Registrati)-->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous">
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
      integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
      crossorigin="anonymous">
    </script>

    <!--Francesca: script common e login-->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
