<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Home</title>
  <!-- Gabriel: percorsi di CSS e JS aggiornati alla cartella assets/ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <!-- Riempi via JS in common.js -->
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-nav">
          <button class="nav-btn" aria-label="Indietro">‹</button>
          <button class="nav-btn" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill">Studente Epicode</div>
      </header>

      <!-- section con rendering card da api con categorie. Gli id dan vedere insieme -->
      <section class="home">




        <div class="container flex-column gap-4 ">
          <div id="preferiti" >
            <h2>I tuoi preferiti</h2>
            
          </div>

          <div id="recenti">
            <h2>Riprodotti di recente</h2>

          </div>

          <div id="rock">
            <h2>Suggerimenti rock</h2>
            
          </div>

          <div id="pop">
            <h2>Suggerimenti pop</h2>
            
          </div>

          <div id="italianPop">
            <h2>Suggerimenti italian pop</h2>
            
          </div>
          <!--
            SEZIONI DA COSTRUIRE (vedi js/home.js):
            - "Riprodotti di recente" (da localStorage history)
            - "I tuoi preferiti" (da localStorage favourites)
            - "Suggerimenti pop"
            - "Suggerimenti rock"
            - "Suggerimenti italian pop"
            Ogni sezione è un <section class="row"> con titolo h2 e una griglia di .card.
          -->
        </div>
      </section>
    </main>

    <footer class="player">
      <!-- Riempi via JS in common.js -->
    </footer>
  </div>

  <audio id="audio-element"></audio>

   <!-- script bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/home.js"></script>
</body>

</html>
